plugins {
	// see https://fabricmc.net/develop/ for new versions
	id 'fabric-loom' version '1.10-SNAPSHOT' apply false
	// see https://github.com/neoforged/ModDevGradle for new versions
	id 'net.neoforged.moddev.legacyforge' version '2.0.141' apply false

	id 'com.diffplug.spotless' version '8.6.0'
}

repositories {
	mavenCentral()
}

spotless {
	format 'misc', {
		target '*.gradle', '.gitattributes', '.gitignore'

		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}
	java {
		target 'common/src/main/java/**/*.java',
				'common/src/test/java/**/*.java',
				'fabric/src/main/java/**/*.java',
				'forge/src/main/java/**/*.java'
		palantirJavaFormat()
	}
}
